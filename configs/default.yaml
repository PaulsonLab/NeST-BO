defaults:
  - benchmark: ???
  - _self_

algorithm: nestbo  # nestbo (NeST-BO) or nestbo_sub (NeST-BO-sub)
seed: 0
device: "cpu"
gd_lengthscale_scaling: false  # scale the fallback gradient step by the GP lengthscales
raw_samples: 256  # random candidates used to pick the acquisition optimizer's restart points

hydra:
  job:
    config:
      override_dirname:
        exclude_keys:
          - local # Removes local specification in hydra dirname
    name: ${now:%Y-%m-%d-%H-%M-%S} # Name of the job
  run:
    # For a single run (not a sweep), just use the job name
    dir: ./outputs/${hydra.job.name}
  sweep:
    # For multirun/sweep create subfolders for each combination, named parameters
    dir: ./outputs/${hydra.job.name}
    subdir: ${hydra.job.override_dirname}

benchmark:  # see subconfigs for benchmark-specific options
  n_tot: ???  # Evaluation budget after the initial design (n_tot - 1 new evaluations)
  N_init: ???  # Number of initial Sobol points (not counted in n_tot)
  mujoco:
    binary_path: null
    apptainer_sif_path: null
